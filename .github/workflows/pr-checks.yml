name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  type-check-and-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vin-recall-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: vin-recall-mcp/package-lock.json

      - run: npm ci

      - run: npm run type-check

      # Hits the real NHTSA APIs (no mocking, by design — see evals/cases.ts).
      # One PR's worth of eval runs is nowhere near NHTSA's ~10-15 req/s
      # temp-block threshold documented in CLAUDE.md.
      - run: npm run eval
